name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt cyclonedx-bom
      - name: Validate portable skill
        run: python coletando-documentacao-tdn-protheus/scripts/validate_skill.py coletando-documentacao-tdn-protheus
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build distributable ZIP
        run: python package.py --output dist/tdn-protheus-skill-kit.zip
      - name: Generate SBOM
        run: python -m cyclonedx_py environment --output-file dist/sbom.cdx.json --of JSON
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/
