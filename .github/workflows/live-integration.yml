name: Live TDN Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sd1100i:
    name: Skill v2 -> MCP -> cited SD1100I
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Skill Kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          path: skill-kit
      - name: Checkout MCP hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          repository: danielmontagna86-source/tdn-protheus-mcp
          ref: hardening/full-validation
          path: mcp
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.11'
          cache: pip
      - name: Install both projects
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r skill-kit/requirements.txt
          python -m pip install ./mcp
      - name: Prepare evidence directory
        run: mkdir -p live-evidence
      - name: Dry-run one known public TDN page
        run: |
          python skill-kit/coletando-documentacao-tdn-protheus/scripts/sync_tdn_snapshot.py snapshot \
            --root-id 908337356 \
            --cache-dir "$RUNNER_TEMP/tdn-live-cache" \
            --max-depth 0 \
            --max-duration-seconds 60 \
            --dry-run | tee live-evidence/01-dry-run.json
      - name: Create bounded snapshot v2
        run: |
          python skill-kit/coletando-documentacao-tdn-protheus/scripts/sync_tdn_snapshot.py snapshot \
            --root-id 908337356 \
            --cache-dir "$RUNNER_TEMP/tdn-live-cache" \
            --max-depth 0 \
            --checkpoint-every 1 | tee live-evidence/02-snapshot.json
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tdn-live-cache' / '908337356'
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 2, manifest
          assert manifest['root_id'] == 908337356, manifest
          active = [pid for pid, item in manifest['pages'].items() if item.get('status') == 'active']
          assert active == ['908337356'], manifest
          evidence = {k: manifest.get(k) for k in ('schema_version','root_id','generation_id','page_directory','last_complete_at')}
          evidence['active_page_ids'] = active
          pathlib.Path('live-evidence/03-manifest-summary.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Configure read-only MCP
        run: |
          python - <<'PY'
          import json, os, pathlib
          config = {
            'cache_root': str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'tdn-live-cache'),
            'allowed_root_ids': ['908337356'],
            'offline': True,
            'allow_mutations': False,
            'max_results': 20,
            'max_chars': 24000,
          }
          pathlib.Path('live-mcp.json').write_text(json.dumps(config, indent=2), encoding='utf-8')
          PY
      - name: Doctor and index
        run: |
          tdn-protheus-mcp doctor --config live-mcp.json --json | tee live-evidence/04-doctor-before-index.json
          tdn-protheus-mcp index --config live-mcp.json --root-id 908337356 --json | tee live-evidence/05-index.json
      - name: Search and retain citation metadata only
        run: |
          tdn-protheus-mcp search --config live-mcp.json --root-id 908337356 --query SD1100I --routine SD1100I --json > "$RUNNER_TEMP/search-result.json"
          python - <<'PY'
          import json, os, pathlib
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'search-result.json'
          payload = json.loads(source.read_text(encoding='utf-8'))
          results = payload.get('results', [])
          assert results, {'root_id': payload.get('root_id'), 'result_count': 0}
          first = results[0]
          assert first['page_id'] == '908337356', {k: first.get(k) for k in ('page_id','chunk_id','title','source_url')}
          assert first['source_url'].startswith('https://tdn.totvs.com/'), first['source_url']
          assert first['chunk_id'], first
          summary = {k: first[k] for k in ('page_id','chunk_id','title','source_url','version_number')}
          pathlib.Path('live-evidence/06-citation-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          source.unlink(missing_ok=True)
          PY
      - name: Prove anti-hallucination filter
        run: |
          tdn-protheus-mcp search --config live-mcp.json --root-id 908337356 --query SD1100I --routine MT103VALIDAITENSXYZ --json > "$RUNNER_TEMP/no-evidence.json"
          python - <<'PY'
          import json, os, pathlib
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'no-evidence.json'
          payload = json.loads(source.read_text(encoding='utf-8'))
          assert payload.get('results') == [], {'root_id': payload.get('root_id'), 'result_count': len(payload.get('results', []))}
          pathlib.Path('live-evidence/07-no-evidence-summary.json').write_text(json.dumps({'root_id': payload.get('root_id'), 'result_count': 0}, indent=2), encoding='utf-8')
          source.unlink(missing_ok=True)
          PY
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: live-tdn-sd1100i-evidence
          path: live-evidence/
          if-no-files-found: warn
