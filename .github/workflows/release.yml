name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify release version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt cyclonedx-bom coverage ruff pip-audit
      - name: Validate and audit
        run: |
          python coletando-documentacao-tdn-protheus/scripts/validate_skill.py coletando-documentacao-tdn-protheus
          python -m ruff check install.py package.py coletando-documentacao-tdn-protheus/scripts tests
          python -m coverage run --rcfile=.coveragerc -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage report --rcfile=.coveragerc --fail-under=70
          python -m pip_audit -r requirements.txt
      - name: Build release assets
        run: |
          mkdir -p dist
          python package.py --output "dist/tdn-protheus-skill-kit-${GITHUB_REF_NAME}.zip"
          python -m cyclonedx_py environment --output-file dist/sbom.cdx.json --of JSON
          cd dist
          sha256sum "tdn-protheus-skill-kit-${GITHUB_REF_NAME}.zip" sbom.cdx.json > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "dist/tdn-protheus-skill-kit-${GITHUB_REF_NAME}.zip" dist/sbom.cdx.json dist/SHA256SUMS.txt --generate-notes --title "TDN Protheus Skill Kit ${GITHUB_REF_NAME}"
