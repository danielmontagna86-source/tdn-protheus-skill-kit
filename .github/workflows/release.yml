name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify release version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Install and test
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build release assets
        run: |
          mkdir -p dist
          python package.py --output "dist/tdn-protheus-skill-kit-${GITHUB_REF_NAME}.zip"
          cd dist
          sha256sum "tdn-protheus-skill-kit-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "TDN Protheus Skill Kit ${GITHUB_REF_NAME}"
